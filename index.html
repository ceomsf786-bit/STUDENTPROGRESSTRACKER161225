<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Progress Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .breadcrumb {
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            color: #667eea;
            cursor: pointer;
            font-weight: 500;
        }

        .breadcrumb-item:hover {
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: #6c757d;
        }

        .content {
            padding: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .btn-success {
            background: #28a745;
            margin-left: 10px;
        }

        .btn-info {
            background: #17a2b8;
            margin-left: 10px;
        }

        .btn-danger {
            background: #dc3545;
            padding: 8px 16px;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .card-info {
            color: #6c757d;
            font-size: 0.9em;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .topic-detail {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .subtopic-container {
            margin-top: 20px;
            padding-left: 20px;
            border-left: 3px solid #667eea;
        }

        .subtopic-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }

        .subtopic-item h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .topic-detail h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status-excellent { background: #28a745; color: white; }
        .status-good { background: #20c997; color: white; }
        .status-average { background: #ffc107; color: #333; }
        .status-needs-improvement { background: #fd7e14; color: white; }
        .status-struggling { background: #dc3545; color: white; }
        .status-not-applicable { background: #6c757d; color: white; }

        .remedy-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #dee2e6;
        }

        .remedy-section h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .template-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .template-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .template-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .template-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .template-item h4 {
            color: #333;
            margin: 0;
        }

        .template-item p {
            color: #6c757d;
            font-size: 0.9em;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Student Progress Tracker</h1>
            <p>Organize, track, and support student learning</p>
            <div style="margin-top: 15px;">
                <button class="btn" onclick="exportAllData()" style="margin: 5px;">💾 Backup All Data</button>
                <button class="btn btn-info" onclick="document.getElementById('importFile').click()" style="margin: 5px;">📥 Restore Backup</button>
                <button class="btn btn-success" onclick="exportTemplates()" style="margin: 5px;">📤 Export Templates</button>
                <button class="btn btn-info" onclick="document.getElementById('importTemplateFile').click()" style="margin: 5px;">📥 Import Templates</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importAllData(event)">
                <input type="file" id="importTemplateFile" accept=".json" style="display: none;" onchange="importTemplates(event)">
            </div>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>

        <div class="content" id="content"></div>
    </div>

    <!-- Add Student Modal -->
    <div class="modal" id="addStudentModal">
        <div class="modal-content">
            <h2>Add New Student</h2>
            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="studentName" placeholder="Enter student name">
            </div>
            <button class="btn" onclick="saveStudent()">Add Student</button>
            <button class="btn btn-secondary" onclick="closeModal('addStudentModal')">Cancel</button>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div class="modal" id="addSubjectModal">
        <div class="modal-content">
            <h2>Add New Subject</h2>
            <div class="form-group">
                <label>Subject Name</label>
                <input type="text" id="subjectName" placeholder="Enter subject name">
            </div>
            <button class="btn" onclick="saveSubject()">Add Subject</button>
            <button class="btn btn-secondary" onclick="closeModal('addSubjectModal')">Cancel</button>
        </div>
    </div>

    <!-- Add Topic Modal -->
    <div class="modal" id="addTopicModal">
        <div class="modal-content">
            <h2>Add New Topic</h2>
            <div class="form-group">
                <label>Topic Name</label>
                <input type="text" id="topicName" placeholder="Enter topic name">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="topicStatus">
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="average">Average</option>
                    <option value="needs-improvement">Needs Improvement</option>
                    <option value="struggling">Struggling</option>
                    <option value="not-applicable">Not Applicable</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="topicNotes" placeholder="Enter notes about student's performance..."></textarea>
            </div>
            <div class="form-group">
                <label>Remedy/Support Plan</label>
                <textarea id="topicRemedy" placeholder="Enter recommendations and support strategies..."></textarea>
            </div>
            <button class="btn" onclick="saveTopic()">Add Topic</button>
            <button class="btn btn-secondary" onclick="closeModal('addTopicModal')">Cancel</button>
        </div>
    </div>

    <!-- Edit Topic Modal -->
    <div class="modal" id="editTopicModal">
        <div class="modal-content">
            <h2>Edit Topic</h2>
            <div class="form-group">
                <label>Topic Name</label>
                <input type="text" id="editTopicName" placeholder="Enter topic name">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="editTopicStatus">
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="average">Average</option>
                    <option value="needs-improvement">Needs Improvement</option>
                    <option value="struggling">Struggling</option>
                    <option value="not-applicable">Not Applicable</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="editTopicNotes" placeholder="Enter notes about student's performance..."></textarea>
            </div>
            <div class="form-group">
                <label>Remedy/Support Plan</label>
                <textarea id="editTopicRemedy" placeholder="Enter recommendations and support strategies..."></textarea>
            </div>
            <button class="btn" onclick="updateTopic()">Update Topic</button>
            <button class="btn btn-secondary" onclick="closeModal('editTopicModal')">Cancel</button>
        </div>
    </div>

    <!-- Add Subtopic Modal -->
    <div class="modal" id="addSubtopicModal">
        <div class="modal-content">
            <h2>Add New Subtopic</h2>
            <div class="form-group">
                <label>Subtopic Name</label>
                <input type="text" id="subtopicName" placeholder="Enter subtopic name">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="subtopicStatus">
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="average">Average</option>
                    <option value="needs-improvement">Needs Improvement</option>
                    <option value="struggling">Struggling</option>
                    <option value="not-applicable">Not Applicable</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="subtopicNotes" placeholder="Enter notes about student's performance..."></textarea>
            </div>
            <div class="form-group">
                <label>Remedy/Support Plan</label>
                <textarea id="subtopicRemedy" placeholder="Enter recommendations and support strategies..."></textarea>
            </div>
            <button class="btn" onclick="saveSubtopic()">Add Subtopic</button>
            <button class="btn btn-secondary" onclick="closeModal('addSubtopicModal')">Cancel</button>
        </div>
    </div>

    <!-- Edit Subtopic Modal -->
    <div class="modal" id="editSubtopicModal">
        <div class="modal-content">
            <h2>Edit Subtopic</h2>
            <div class="form-group">
                <label>Subtopic Name</label>
                <input type="text" id="editSubtopicName" placeholder="Enter subtopic name">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="editSubtopicStatus">
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="average">Average</option>
                    <option value="needs-improvement">Needs Improvement</option>
                    <option value="struggling">Struggling</option>
                    <option value="not-applicable">Not Applicable</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="editSubtopicNotes" placeholder="Enter notes about student's performance..."></textarea>
            </div>
            <div class="form-group">
                <label>Remedy/Support Plan</label>
                <textarea id="editSubtopicRemedy" placeholder="Enter recommendations and support strategies..."></textarea>
            </div>
            <button class="btn" onclick="updateSubtopic()">Update Subtopic</button>
            <button class="btn btn-secondary" onclick="closeModal('editSubtopicModal')">Cancel</button>
        </div>
    </div>

    <!-- Import Subject Modal -->
    <div class="modal" id="importSubjectModal">
        <div class="modal-content">
            <h2>Import Subject Template</h2>
            <div class="form-group">
                <label>Select Template</label>
                <select id="templateSelect">
                    <option value="">Choose a template...</option>
                </select>
            </div>
            <button class="btn" onclick="importSubjectFromTemplate()">Import Template</button>
            <button class="btn btn-secondary" onclick="closeModal('importSubjectModal')">Cancel</button>
        </div>
    </div>

    <script>
        let data = {
            students: [],
            templates: []
        };

        let currentView = 'students';
        let currentStudent = null;
        let currentSubject = null;
        let currentTopic = null;
        let currentTopicIndex = null;
        let currentSubtopicIndex = null;

        // Load data from memory on start
        loadData();

        function loadData() {
            const saved = localStorage.getItem('studentTrackerData');
            if (saved) {
                data = JSON.parse(saved);
            }
            renderView();
        }

        function saveData() {
            localStorage.setItem('studentTrackerData', JSON.stringify(data));
        }

        function renderView() {
            if (currentView === 'students') {
                renderStudents();
            } else if (currentView === 'subjects') {
                renderSubjects();
            } else if (currentView === 'topics') {
                renderTopics();
            }
        }

        function renderBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            let html = '<span class="breadcrumb-item" onclick="showStudents()">Students</span>';
            html += '<span class="breadcrumb-separator">|</span>';
            html += '<span class="breadcrumb-item" onclick="renderTemplates()">Templates</span>';
            
            if (currentStudent) {
                html += '<span class="breadcrumb-separator">›</span>';
                html += `<span class="breadcrumb-item" onclick="showSubjects('${currentStudent}')">${currentStudent}</span>`;
            }
            
            if (currentSubject) {
                html += '<span class="breadcrumb-separator">›</span>';
                html += `<span class="breadcrumb-item" onclick="showTopics('${currentStudent}', '${currentSubject}')">${currentSubject}</span>`;
            }

            if (currentTopic !== null && typeof currentTopic === 'string') {
                html += '<span class="breadcrumb-separator">›</span>';
                html += `<span class="breadcrumb-item">${currentTopic}</span>`;
            }
            
            breadcrumb.innerHTML = html;
        }

        function renderStudents() {
            currentView = 'students';
            currentStudent = null;
            currentSubject = null;
            renderBreadcrumb();
            
            const content = document.getElementById('content');
            
            let html = '<button class="btn" onclick="openModal(\'addStudentModal\')">+ Add New Student</button>';
            
            if (data.students.length === 0) {
                html += `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <h2>No Students Yet</h2>
                        <p>Click "Add New Student" to get started</p>
                    </div>
                `;
            } else {
                html += '<div class="grid">';
                data.students.forEach((student, index) => {
                    const subjectCount = student.subjects ? student.subjects.length : 0;
                    html += `
                        <div class="card" onclick="showSubjects('${student.name}')">
                            <button class="delete-btn" onclick="event.stopPropagation(); deleteStudent(${index})">×</button>
                            <h3>${student.name}</h3>
                            <p class="card-info">${subjectCount} subject${subjectCount !== 1 ? 's' : ''}</p>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            content.innerHTML = html;
        }

        function renderSubjects() {
            currentView = 'subjects';
            renderBreadcrumb();
            
            const content = document.getElementById('content');
            const student = data.students.find(s => s.name === currentStudent);
            
            let html = `
                <button class="btn" onclick="openModal('addSubjectModal')">+ Add New Subject</button>
                <button class="btn btn-info" onclick="openModal('importSubjectModal')">📥 Import Subject Template</button>
                <button class="btn btn-success" onclick="exportStudentToPDF()">📄 Export to PDF</button>
            `;
            
            if (!student.subjects || student.subjects.length === 0) {
                html += `
                    <div class="empty-state">
                        <h2>No Subjects Yet</h2>
                        <p>Click "Add New Subject" to start tracking this student's progress</p>
                    </div>
                `;
            } else {
                html += '<div class="grid">';
                student.subjects.forEach((subject, index) => {
                    const topicCount = subject.topics ? subject.topics.length : 0;
                    html += `
                        <div class="card" onclick="showTopics('${currentStudent}', '${subject.name}')">
                            <button class="delete-btn" onclick="event.stopPropagation(); deleteSubject(${index})">×</button>
                            <h3>${subject.name}</h3>
                            <p class="card-info">${topicCount} topic${topicCount !== 1 ? 's' : ''}</p>
                            <button class="btn" style="padding: 6px 12px; font-size: 13px; margin: 5px; width: calc(50% - 10px);" onclick="event.stopPropagation(); editSubjectName(${index})">✏️ Edit Name</button>
                            <button class="btn btn-info" style="padding: 6px 12px; font-size: 13px; margin: 5px; width: calc(50% - 10px);" onclick="event.stopPropagation(); saveSubjectAsTemplate(${index})">💾 Save Template</button>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            content.innerHTML = html;
        }

        function renderTemplates() {
            currentView = 'templates';
            currentStudent = null;
            currentSubject = null;
            renderBreadcrumb();
            
            const content = document.getElementById('content');
            
            let html = '<button class="btn" onclick="showStudents()">← Back to Students</button>';
            html += '<h2 style="margin-top: 20px; color: #333;">Subject Templates</h2>';
            html += '<p style="color: #6c757d; margin-bottom: 20px;">Manage reusable subject templates with topics and subtopics</p>';
            
            if (!data.templates || data.templates.length === 0) {
                html += `
                    <div class="empty-state">
                        <h2>No Templates Yet</h2>
                        <p>Save a subject as a template from any student's subject page</p>
                    </div>
                `;
            } else {
                html += '<div class="template-list">';
                data.templates.forEach((template, index) => {
                    const topicCount = template.topics ? template.topics.length : 0;
                    let subtopicCount = 0;
                    if (template.topics) {
                        template.topics.forEach(topic => {
                            if (topic.subtopics) subtopicCount += topic.subtopics.length;
                        });
                    }
                    
                    html += `
                        <div class="template-item">
                            <div>
                                <h4>${template.name}</h4>
                                <p>${topicCount} topic${topicCount !== 1 ? 's' : ''}, ${subtopicCount} subtopic${subtopicCount !== 1 ? 's' : ''}</p>
                            </div>
                            <div>
                                <button class="btn btn-danger" onclick="deleteTemplate(${index})">Delete</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            content.innerHTML = html;
        }

        function renderTopics() {
            currentView = 'topics';
            currentTopic = null;
            renderBreadcrumb();
            
            const content = document.getElementById('content');
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects.find(s => s.name === currentSubject);
            
            let html = '<button class="btn" onclick="openModal(\'addTopicModal\')">+ Add New Topic</button>';
            
            if (!subject.topics || subject.topics.length === 0) {
                html += `
                    <div class="empty-state">
                        <h2>No Topics Yet</h2>
                        <p>Click "Add New Topic" to track progress on specific topics</p>
                    </div>
                `;
            } else {
                subject.topics.forEach((topic, index) => {
                    html += `
                        <div class="topic-detail">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div style="flex: 1;">
                                    <h3>${topic.name}</h3>
                                    <span class="status-badge status-${topic.status}">${formatStatus(topic.status)}</span>
                                </div>
                                <div>
                                    <button class="btn" style="padding: 8px 16px; font-size: 14px; margin-right: 5px;" onclick="editTopic(${index})">Edit</button>
                                    <button class="btn" style="padding: 8px 16px; font-size: 14px; margin-right: 5px; background: #17a2b8;" onclick="showSubtopics(${index}, '${topic.name}')">Subtopics</button>
                                    <button class="btn btn-danger" onclick="deleteTopic(${index})">Delete</button>
                                </div>
                            </div>
                            ${topic.notes ? `<p><strong>Notes:</strong> ${topic.notes}</p>` : ''}
                            ${topic.remedy ? `
                                <div class="remedy-section">
                                    <h4>📋 Support Plan</h4>
                                    <p>${topic.remedy}</p>
                                </div>
                            ` : ''}
                            ${(topic.subtopics && topic.subtopics.length > 0) ? `
                                <p style="margin-top: 15px; color: #667eea; font-weight: 600;">
                                    ${topic.subtopics.length} subtopic${topic.subtopics.length !== 1 ? 's' : ''}
                                </p>
                            ` : ''}
                        </div>
                    `;
                });
            }
            
            content.innerHTML = html;
        }

        function showSubtopics(topicIndex, topicName) {
            currentView = 'subtopics';
            currentTopic = topicName;
            currentTopicIndex = topicIndex;
            renderSubtopics();
        }

        function renderSubtopics() {
            renderBreadcrumb();
            
            const content = document.getElementById('content');
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects.find(s => s.name === currentSubject);
            const topic = subject.topics[currentTopicIndex];
            
            let html = '<button class="btn" onclick="openModal(\'addSubtopicModal\')">+ Add New Subtopic</button>';
            
            if (!topic.subtopics || topic.subtopics.length === 0) {
                html += `
                    <div class="empty-state">
                        <h2>No Subtopics Yet</h2>
                        <p>Click "Add New Subtopic" to track detailed progress</p>
                    </div>
                `;
            } else {
                html += '<div style="margin-top: 20px;">';
                topic.subtopics.forEach((subtopic, index) => {
                    html += `
                        <div class="subtopic-item">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div style="flex: 1;">
                                    <h4>${subtopic.name}</h4>
                                    <span class="status-badge status-${subtopic.status}">${formatStatus(subtopic.status)}</span>
                                </div>
                                <div>
                                    <button class="btn" style="padding: 8px 16px; font-size: 14px; margin-right: 5px;" onclick="editSubtopic(${index})">Edit</button>
                                    <button class="btn btn-danger" onclick="deleteSubtopic(${index})">Delete</button>
                                </div>
                            </div>
                            ${subtopic.notes ? `<p style="margin-top: 10px;"><strong>Notes:</strong> ${subtopic.notes}</p>` : ''}
                            ${subtopic.remedy ? `
                                <div class="remedy-section">
                                    <h4>📋 Support Plan</h4>
                                    <p>${subtopic.remedy}</p>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            content.innerHTML = html;
        }

        function formatStatus(status) {
            return status.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function showStudents() {
            renderStudents();
        }

        function showSubjects(studentName) {
            currentStudent = studentName;
            renderSubjects();
        }

        function showTopics(studentName, subjectName) {
            currentStudent = studentName;
            currentSubject = subjectName;
            renderTopics();
        }

        function openModal(modalId) {
            // Populate template select if opening import modal
            if (modalId === 'importSubjectModal') {
                const select = document.getElementById('templateSelect');
                select.innerHTML = '<option value="">Choose a template...</option>';
                if (data.templates && data.templates.length > 0) {
                    data.templates.forEach((template, index) => {
                        const topicCount = template.topics ? template.topics.length : 0;
                        select.innerHTML += `<option value="${index}">${template.name} (${topicCount} topics)</option>`;
                    });
                }
            }
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveStudent() {
            const name = document.getElementById('studentName').value.trim();
            if (name) {
                data.students.push({ name: name, subjects: [] });
                saveData();
                document.getElementById('studentName').value = '';
                closeModal('addStudentModal');
                renderStudents();
            }
        }

        function saveSubject() {
            const name = document.getElementById('subjectName').value.trim();
            if (name) {
                const student = data.students.find(s => s.name === currentStudent);
                if (!student.subjects) student.subjects = [];
                student.subjects.push({ name: name, topics: [] });
                saveData();
                document.getElementById('subjectName').value = '';
                closeModal('addSubjectModal');
                renderSubjects();
            }
        }

        function saveTopic() {
            const name = document.getElementById('topicName').value.trim();
            const status = document.getElementById('topicStatus').value;
            const notes = document.getElementById('topicNotes').value.trim();
            const remedy = document.getElementById('topicRemedy').value.trim();
            
            if (name) {
                const student = data.students.find(s => s.name === currentStudent);
                const subject = student.subjects.find(s => s.name === currentSubject);
                if (!subject.topics) subject.topics = [];
                subject.topics.push({ name, status, notes, remedy, subtopics: [] });
                saveData();
                document.getElementById('topicName').value = '';
                document.getElementById('topicStatus').value = 'excellent';
                document.getElementById('topicNotes').value = '';
                document.getElementById('topicRemedy').value = '';
                closeModal('addTopicModal');
                renderTopics();
            }
        }

        function editTopic(index) {
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects.find(s => s.name === currentSubject);
            const topic = subject.topics[index];
            
            currentTopicIndex = index;
            document.getElementById('editTopicName').value = topic.name;
            document.getElementById('editTopicStatus').value = topic.status;
            document.getElementById('editTopicNotes').value = topic.notes || '';
            document.getElementById('editTopicRemedy').value = topic.remedy || '';
            openModal('editTopicModal');
        }

        function updateTopic() {
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects.find(s => s.name === currentSubject);
            const topic = subject.topics[currentTopicIndex];
            
            topic.name = document.getElementById('editTopicName').value.trim();
            topic.status = document.getElementById('editTopicStatus').value;
            topic.notes = document.getElementById('editTopicNotes').value.trim();
            topic.remedy = document.getElementById('editTopicRemedy').value.trim();
            
            saveData();
            closeModal('editTopicModal');
            renderTopics();
        }

        function saveSubtopic() {
            const name = document.getElementById('subtopicName').value.trim();
            const status = document.getElementById('subtopicStatus').value;
            const notes = document.getElementById('subtopicNotes').value.trim();
            const remedy = document.getElementById('subtopicRemedy').value.trim();
            
            if (name) {
                const student = data.students.find(s => s.name === currentStudent);
                const subject = student.subjects.find(s => s.name === currentSubject);
                const topic = subject.topics[currentTopicIndex];
                if (!topic.subtopics) topic.subtopics = [];
                topic.subtopics.push({ name, status, notes, remedy });
                saveData();
                document.getElementById('subtopicName').value = '';
                document.getElementById('subtopicStatus').value = 'excellent';
                document.getElementById('subtopicNotes').value = '';
                document.getElementById('subtopicRemedy').value = '';
                closeModal('addSubtopicModal');
                renderSubtopics();
            }
        }

        function editSubtopic(index) {
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects.find(s => s.name === currentSubject);
            const topic = subject.topics[currentTopicIndex];
            const subtopic = topic.subtopics[index];
            
            currentSubtopicIndex = index;
            document.getElementById('editSubtopicName').value = subtopic.name;
            document.getElementById('editSubtopicStatus').value = subtopic.status;
            document.getElementById('editSubtopicNotes').value = subtopic.notes || '';
            document.getElementById('editSubtopicRemedy').value = subtopic.remedy || '';
            openModal('editSubtopicModal');
        }

        function updateSubtopic() {
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects.find(s => s.name === currentSubject);
            const topic = subject.topics[currentTopicIndex];
            const subtopic = topic.subtopics[currentSubtopicIndex];
            
            subtopic.name = document.getElementById('editSubtopicName').value.trim();
            subtopic.status = document.getElementById('editSubtopicStatus').value;
            subtopic.notes = document.getElementById('editSubtopicNotes').value.trim();
            subtopic.remedy = document.getElementById('editSubtopicRemedy').value.trim();
            
            saveData();
            closeModal('editSubtopicModal');
            renderSubtopics();
        }

        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this student and all their data?')) {
                data.students.splice(index, 1);
                saveData();
                renderStudents();
            }
        }

        function deleteSubject(index) {
            if (confirm('Are you sure you want to delete this subject and all its topics?')) {
                const student = data.students.find(s => s.name === currentStudent);
                student.subjects.splice(index, 1);
                saveData();
                renderSubjects();
            }
        }

        function deleteTopic(index) {
            if (confirm('Are you sure you want to delete this topic and all its subtopics?')) {
                const student = data.students.find(s => s.name === currentStudent);
                const subject = student.subjects.find(s => s.name === currentSubject);
                subject.topics.splice(index, 1);
                saveData();
                renderTopics();
            }
        }

        function deleteSubtopic(index) {
            if (confirm('Are you sure you want to delete this subtopic?')) {
                const student = data.students.find(s => s.name === currentStudent);
                const subject = student.subjects.find(s => s.name === currentSubject);
                const topic = subject.topics[currentTopicIndex];
                topic.subtopics.splice(index, 1);
                saveData();
                renderSubtopics();
            }
        }

        function saveSubjectAsTemplate(subjectIndex) {
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects[subjectIndex];
            
            // Deep clone the subject to avoid reference issues
            const template = JSON.parse(JSON.stringify(subject));
            
            // Clear all status, notes, and remedies from template
            if (template.topics) {
                template.topics.forEach(topic => {
                    topic.status = 'average';
                    topic.notes = '';
                    topic.remedy = '';
                    if (topic.subtopics) {
                        topic.subtopics.forEach(subtopic => {
                            subtopic.status = 'average';
                            subtopic.notes = '';
                            subtopic.remedy = '';
                        });
                    }
                });
            }
            
            if (!data.templates) data.templates = [];
            
            // Check if template with same name exists
            const existingIndex = data.templates.findIndex(t => t.name === template.name);
            if (existingIndex >= 0) {
                if (confirm(`A template named "${template.name}" already exists. Do you want to replace it?`)) {
                    data.templates[existingIndex] = template;
                }
            } else {
                data.templates.push(template);
            }
            
            saveData();
            alert(`Template "${template.name}" saved successfully!`);
        }

        function importSubjectFromTemplate() {
            const templateIndex = document.getElementById('templateSelect').value;
            if (templateIndex === '') return;
            
            const template = data.templates[parseInt(templateIndex)];
            const student = data.students.find(s => s.name === currentStudent);
            
            // Check if subject with same name exists
            let existingSubject = student.subjects.find(s => s.name === template.name);
            
            if (existingSubject) {
                // MERGE: Add topics that don't exist in the current subject
                const templateCopy = JSON.parse(JSON.stringify(template));
                let addedTopics = 0;
                
                if (!existingSubject.topics) existingSubject.topics = [];
                
                templateCopy.topics.forEach(templateTopic => {
                    const topicExists = existingSubject.topics.find(t => t.name === templateTopic.name);
                    if (!topicExists) {
                        existingSubject.topics.push(templateTopic);
                        addedTopics++;
                    } else {
                        // Topic exists, now merge subtopics
                        if (templateTopic.subtopics && templateTopic.subtopics.length > 0) {
                            if (!topicExists.subtopics) topicExists.subtopics = [];
                            templateTopic.subtopics.forEach(templateSubtopic => {
                                const subtopicExists = topicExists.subtopics.find(st => st.name === templateSubtopic.name);
                                if (!subtopicExists) {
                                    topicExists.subtopics.push(templateSubtopic);
                                }
                            });
                        }
                    }
                });
                
                saveData();
                closeModal('importSubjectModal');
                renderSubjects();
                alert(`Merged successfully! Added ${addedTopics} new topic(s) to existing "${template.name}" subject.`);
            } else {
                // Subject doesn't exist, add it completely
                const newSubject = JSON.parse(JSON.stringify(template));
                if (!student.subjects) student.subjects = [];
                student.subjects.push(newSubject);
                saveData();
                closeModal('importSubjectModal');
                renderSubjects();
                alert(`Subject "${template.name}" imported successfully!`);
            }
        }

        function editSubjectName(index) {
            const student = data.students.find(s => s.name === currentStudent);
            const subject = student.subjects[index];
            const newName = prompt('Enter new subject name:', subject.name);
            
            if (newName && newName.trim() !== '' && newName !== subject.name) {
                const trimmedName = newName.trim();
                // Check if another subject with this name exists
                const exists = student.subjects.find((s, i) => s.name === trimmedName && i !== index);
                if (exists) {
                    alert('A subject with this name already exists!');
                    return;
                }
                subject.name = trimmedName;
                saveData();
                renderSubjects();
            }
        }

        function deleteTemplate(index) {
            if (confirm('Are you sure you want to delete this template?')) {
                data.templates.splice(index, 1);
                saveData();
                renderTemplates();
            }
        }

        function exportStudentToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const student = data.students.find(s => s.name === currentStudent);
            if (!student) return;
            
            let yPos = 20;
            const lineHeight = 7;
            const pageHeight = 280;
            
            // Title
            doc.setFontSize(20);
            doc.setFont(undefined, 'bold');
            doc.text(`Student Progress Report: ${student.name}`, 15, yPos);
            yPos += 15;
            
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            doc.text(`Generated: ${new Date().toLocaleDateString()}`, 15, yPos);
            yPos += 15;
            
            // Loop through subjects
            if (student.subjects && student.subjects.length > 0) {
                student.subjects.forEach((subject, subIndex) => {
                    if (yPos > pageHeight) {
                        doc.addPage();
                        yPos = 20;
                    }
                    
                    // Subject heading
                    doc.setFontSize(16);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor(102, 126, 234);
                    doc.text(`${subIndex + 1}. ${subject.name}`, 15, yPos);
                    doc.setTextColor(0, 0, 0);
                    yPos += 10;
                    
                    // Topics
                    if (subject.topics && subject.topics.length > 0) {
                        subject.topics.forEach((topic, topIndex) => {
                            if (yPos > pageHeight) {
                                doc.addPage();
                                yPos = 20;
                            }
                            
                            // Topic heading
                            doc.setFontSize(12);
                            doc.setFont(undefined, 'bold');
                            doc.text(`   ${topIndex + 1}.${subIndex + 1}. ${topic.name}`, 20, yPos);
                            yPos += lineHeight;
                            
                            // Status
                            doc.setFontSize(10);
                            doc.setFont(undefined, 'normal');
                            doc.text(`   Status: ${formatStatus(topic.status)}`, 25, yPos);
                            yPos += lineHeight;
                            
                            // Notes
                            if (topic.notes) {
                                doc.setFont(undefined, 'bold');
                                doc.text(`   Notes:`, 25, yPos);
                                yPos += lineHeight;
                                doc.setFont(undefined, 'normal');
                                const notesLines = doc.splitTextToSize(topic.notes, 160);
                                notesLines.forEach(line => {
                                    if (yPos > pageHeight) {
                                        doc.addPage();
                                        yPos = 20;
                                    }
                                    doc.text(`   ${line}`, 25, yPos);
                                    yPos += lineHeight;
                                });
                            }
                            
                            // Remedy
                            if (topic.remedy) {
                                if (yPos > pageHeight) {
                                    doc.addPage();
                                    yPos = 20;
                                }
                                doc.setFont(undefined, 'bold');
                                doc.text(`   Support Plan:`, 25, yPos);
                                yPos += lineHeight;
                                doc.setFont(undefined, 'normal');
                                const remedyLines = doc.splitTextToSize(topic.remedy, 160);
                                remedyLines.forEach(line => {
                                    if (yPos > pageHeight) {
                                        doc.addPage();
                                        yPos = 20;
                                    }
                                    doc.text(`   ${line}`, 25, yPos);
                                    yPos += lineHeight;
                                });
                            }
                            
                            // Subtopics
                            if (topic.subtopics && topic.subtopics.length > 0) {
                                if (yPos > pageHeight) {
                                    doc.addPage();
                                    yPos = 20;
                                }
                                doc.setFont(undefined, 'bold');
                                doc.text(`   Subtopics:`, 25, yPos);
                                yPos += lineHeight;
                                
                                topic.subtopics.forEach((subtopic, subIndex) => {
                                    if (yPos > pageHeight) {
                                        doc.addPage();
                                        yPos = 20;
                                    }
                                    
                                    doc.setFontSize(10);
                                    doc.setFont(undefined, 'bold');
                                    doc.text(`      • ${subtopic.name}`, 30, yPos);
                                    yPos += lineHeight;
                                    
                                    doc.setFont(undefined, 'normal');
                                    doc.text(`        Status: ${formatStatus(subtopic.status)}`, 35, yPos);
                                    yPos += lineHeight;
                                    
                                    if (subtopic.notes) {
                                        doc.text(`        Notes: ${subtopic.notes}`, 35, yPos);
                                        yPos += lineHeight;
                                    }
                                    
                                    if (subtopic.remedy) {
                                        const subRemedyLines = doc.splitTextToSize(`Support: ${subtopic.remedy}`, 150);
                                        subRemedyLines.forEach(line => {
                                            if (yPos > pageHeight) {
                                                doc.addPage();
                                                yPos = 20;
                                            }
                                            doc.text(`        ${line}`, 35, yPos);
                                            yPos += lineHeight;
                                        });
                                    }
                                    yPos += 2;
                                });
                            }
                            
                            yPos += 5;
                        });
                    }
                    
                    yPos += 5;
                });
            } else {
                doc.setFontSize(12);
                doc.text('No subjects recorded yet.', 15, yPos);
            }
            
            // Save the PDF
            doc.save(`${student.name}_Progress_Report.pdf`);
        }

        function exportAllData() {
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            const timestamp = new Date().toISOString().split('T')[0];
            link.download = `StudentTracker_Backup_${timestamp}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            alert('Backup saved successfully! Keep this file safe.');
        }

        function importAllData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Validate the data structure
                    if (!importedData.students || !Array.isArray(importedData.students)) {
                        alert('Invalid backup file format!');
                        return;
                    }
                    
                    if (confirm('This will replace ALL current data with the backup. Continue?')) {
                        data = importedData;
                        // Ensure templates array exists
                        if (!data.templates) data.templates = [];
                        saveData();
                        renderView();
                        alert('Backup restored successfully!');
                    }
                } catch (error) {
                    alert('Error reading backup file. Make sure it\'s a valid JSON file.');
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function exportTemplates() {
            if (!data.templates || data.templates.length === 0) {
                alert('No templates to export!');
                return;
            }
            
            const templatesData = { templates: data.templates };
            const dataStr = JSON.stringify(templatesData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            const timestamp = new Date().toISOString().split('T')[0];
            link.download = `StudentTracker_Templates_${timestamp}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            alert('Templates exported successfully!');
        }

        function importTemplates(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Validate the data structure
                    if (!importedData.templates || !Array.isArray(importedData.templates)) {
                        alert('Invalid template file format!');
                        return;
                    }
                    
                    // Always MERGE templates
                    if (!data.templates) data.templates = [];
                    let addedCount = 0;
                    let mergedCount = 0;
                    
                    importedData.templates.forEach(newTemplate => {
                        const existingIndex = data.templates.findIndex(t => t.name === newTemplate.name);
                        if (existingIndex === -1) {
                            // Template doesn't exist, add it
                            data.templates.push(newTemplate);
                            addedCount++;
                        } else {
                            // Template exists, merge topics and subtopics
                            const existing = data.templates[existingIndex];
                            if (!existing.topics) existing.topics = [];
                            
                            newTemplate.topics.forEach(newTopic => {
                                const topicExists = existing.topics.find(t => t.name === newTopic.name);
                                if (!topicExists) {
                                    existing.topics.push(newTopic);
                                } else {
                                    // Merge subtopics
                                    if (newTopic.subtopics && newTopic.subtopics.length > 0) {
                                        if (!topicExists.subtopics) topicExists.subtopics = [];
                                        newTopic.subtopics.forEach(newSubtopic => {
                                            const subtopicExists = topicExists.subtopics.find(st => st.name === newSubtopic.name);
                                            if (!subtopicExists) {
                                                topicExists.subtopics.push(newSubtopic);
                                            }
                                        });
                                    }
                                }
                            });
                            mergedCount++;
                        }
                    });
                    
                    alert(`Import complete!\n✓ Added ${addedCount} new template(s)\n✓ Merged with ${mergedCount} existing template(s)\nAll your current data is preserved!`);
                    
                    saveData();
                    if (currentView === 'templates') {
                        renderTemplates();
                    }
                } catch (error) {
                    alert('Error reading template file. Make sure it\'s a valid JSON file.');
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
